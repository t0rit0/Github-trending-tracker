# 所有可变项集中在这一个文件。key 放 .env（如 LLM_API_KEY=sk-...）。
# 兴趣配置在 interests.yaml（个人数据不入库，模板见 interests.yaml.example）。
schedule:
  time: "08:00"

scrape:
  window: daily          # daily | weekly | monthly
  languages: [all]       # [all] 或 [python, rust, ...]

provider:
  base_url: "https://api.deepseek.com"
  api_key_env: LLM_API_KEY

models:
  analyst: "deepseek-flash"
  editor: "deepseek-flash"   # 想要更强的成稿可换 deepseek-v4-pro
  keeper: ""                 # 留空复用 analyst

vault: vault             # v1 Keeper 使用
